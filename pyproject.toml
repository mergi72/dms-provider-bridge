[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "dms-provider-bridge"
version = "1.1.8"
description = "Provider bridge service for DMS systems such as eDoCat and Alfresco, with WFX API support."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "dms-provider-bridge team" }
]
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "python-multipart>=0.0.20"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast unit tests",
  "integration: integration tests using FastAPI TestClient"
]

[project.scripts]
dms-provider-bridge = "dms_provider_bridge.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_provider_bridge"]
